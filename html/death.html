<!DOCTYPE html><html><head><style>
html,body{margin:0;padding:0;overflow:hidden;}
#death-screen{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);
display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;
font-family:Arial,sans-serif;font-size:24px;}#timer{margin-top:10px;font-size:20px;}
</style></head><body>
<div id="death-screen">
<div>You are in critical condition</div>
<div id="timer">Respawning in <span id="time">60</span> seconds</div>
</div><script>
window.addEventListener('message',e=>{const ui=document.getElementById('death-screen');
if(e.data.action==='showDeath')ui.style.display='flex';
else if(e.data.action==='updateTimer')document.getElementById('time').innerText=e.data.timer;
else if(e.data.action==='hideDeath')ui.style.display='none';});
</script></body></html>
